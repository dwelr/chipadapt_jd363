[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dwelr-chipadapt_jd363"
version = "0.1.0"
description = "通过字符级与结构级特征识别推理芯片适配工程师·多租户的显存隔离的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "dwelr" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://dwelr.github.io"
Repository = "https://github.com/dwelr/chipadapt_jd363"
Issues = "https://github.com/dwelr/chipadapt_jd363/issues"

[project.scripts]
chipadapt_jd363 = "chipadapt_jd363:main"

[tool.setuptools]
py-modules = ["chipadapt_jd363"]
